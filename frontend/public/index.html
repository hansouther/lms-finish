<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        <link rel="icon" href="%PUBLIC_URL%/icon-192.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
        <meta name="apple-mobile-web-app-title" content="Binara" />
        <meta name="theme-color" content="#0E7490" />
        <meta name="description" content="Binara LMS — platform LMS terintegrasi 5 portal untuk belajar, Try Out CBT, kursus interaktif, dan pemantauan prestasi sekolah mitra." />
        <meta property="og:title" content="Binara LMS — Platform Belajar Terintegrasi" />
        <meta property="og:description" content="Satu ekosistem untuk belajar, mengajar & memantau prestasi. Try Out CBT, kursus interaktif, dan analitik nilai." />
        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="Binara LMS" />
        <meta property="og:image" content="https://images.unsplash.com/photo-1543269865-cbf427effbad?crop=entropy&cs=srgb&fm=jpg&w=1200&q=80" />
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="Binara LMS — Platform Belajar Terintegrasi" />
        <meta name="twitter:description" content="Satu ekosistem untuk belajar, mengajar & memantau prestasi." />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
        <title>Binara LMS — Platform Belajar Terintegrasi</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <style>
            #boot-loader{position:fixed;inset:0;z-index:2147483000;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .4s ease;font-family:Outfit,'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
            #boot-loader .bl-logo{width:84px;height:84px;object-fit:contain;border-radius:20px}
            #boot-loader .bl-mark{width:72px;height:72px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;color:#fff}
            #boot-loader .bl-title{font-size:22px;font-weight:700;letter-spacing:.2px;margin:0}
            #boot-loader .bl-msg{font-size:14px;opacity:.75;margin:0;max-width:340px;line-height:1.5}
            #boot-loader .bl-spin{width:38px;height:38px;border-radius:50%;border:4px solid rgba(255,255,255,.18);animation:blspin .8s linear infinite}
            #boot-loader .bl-bar{width:200px;height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden;position:relative}
            #boot-loader .bl-bar i{position:absolute;top:0;left:-40%;width:40%;height:100%;border-radius:9px;animation:blbar 1.1s ease-in-out infinite}
            #boot-loader .bl-dots{display:flex;gap:8px}
            #boot-loader .bl-dots i{width:11px;height:11px;border-radius:50%;animation:blpulse 1s ease-in-out infinite}
            #boot-loader .bl-dots i:nth-child(2){animation-delay:.15s}#boot-loader .bl-dots i:nth-child(3){animation-delay:.3s}
            @keyframes blspin{to{transform:rotate(360deg)}}
            @keyframes blbar{0%{left:-40%}100%{left:100%}}
            @keyframes blpulse{0%,100%{transform:scale(.6);opacity:.4}50%{transform:scale(1);opacity:1}}
            @media (prefers-reduced-motion:reduce){#boot-loader *{animation-duration:2s!important}}
        </style>
        <script>
            (function () {
                window.__bootStart = Date.now();
                var s = {};
                try { s = JSON.parse(localStorage.getItem("site_settings_cache")) || {}; } catch (e) {}
                if (s.loader_enabled === false) return;
                var hex = /^#[0-9A-Fa-f]{6}$/;
                var bg = hex.test(s.loader_bg_color) ? s.loader_bg_color : "#0A1128";
                var fg = hex.test(s.loader_text_color) ? s.loader_text_color : "#FFFFFF";
                var ac = hex.test(s.loader_accent_color) ? s.loader_accent_color : "#22D3EE";
                var name = s.site_name || "Binara LMS";
                var el = document.createElement("div");
                el.id = "boot-loader";
                el.setAttribute("role", "status");
                el.setAttribute("aria-live", "polite");
                el.style.background = bg;
                el.style.color = fg;
                var logo = s.loader_logo_url || s.logo_url;
                if (logo && /^https?:\/\//.test(logo)) {
                    var img = document.createElement("img");
                    img.className = "bl-logo"; img.alt = ""; img.src = logo;
                    el.appendChild(img);
                } else {
                    var mark = document.createElement("div");
                    mark.className = "bl-mark"; mark.style.background = ac; mark.textContent = name.charAt(0).toUpperCase();
                    el.appendChild(mark);
                }
                var t = document.createElement("p");
                t.className = "bl-title"; t.textContent = s.loader_title || name;
                el.appendChild(t);
                var style = s.loader_style || "spinner", ind = document.createElement("div");
                if (style === "bar") { ind.className = "bl-bar"; var b = document.createElement("i"); b.style.background = ac; ind.appendChild(b); }
                else if (style === "pulse") { ind.className = "bl-dots"; for (var i = 0; i < 3; i++) { var d = document.createElement("i"); d.style.background = ac; ind.appendChild(d); } }
                else { ind.className = "bl-spin"; ind.style.borderTopColor = ac; }
                el.appendChild(ind);
                var m = document.createElement("p");
                m.className = "bl-msg"; m.textContent = s.loader_message == null ? "Mohon tunggu, sedang menyiapkan halaman..." : s.loader_message;
                el.appendChild(m);
                document.body.appendChild(el);
                if (s.favicon_url || s.logo_url) {
                    var link = document.createElement("link"); link.rel = "icon"; link.href = s.favicon_url || s.logo_url; document.head.appendChild(link);
                }
                if (document.title.indexOf("Binara LMS") > -1 && s.site_name) document.title = document.title.split("Binara LMS").join(s.site_name);
            })();
        </script>
    </body>
</html>
